name: Refresh research evidence
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: evidence-refresh
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collectors
        run: python -m unittest discover -s tests -v
      - name: Collect metadata
        id: collect
        continue-on-error: true
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python radar.py
      - name: Upload readable reports
        uses: actions/upload-artifact@v4
        with:
          name: glp1-evidence-radar
          path: |
            reports/
            data/catalog.json
          if-no-files-found: error
      - name: Preserve data and source health
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json reports/index.html reports/latest.md
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh research metadata and source health'
            git push
          fi
      - name: Mark incomplete collection as failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
